services:
  mongo:
    image: mongo:${MONGO_VERSION:-7.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    name: ${MONGO_DATA_VOLUME:-aepmongojava2026_mongo-data}